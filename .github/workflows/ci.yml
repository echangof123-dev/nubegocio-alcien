name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: El seed coincide con el Excel
        run: |
          pip install openpyxl
          python3 db/tools/generar_seed.py
          git diff --exit-code db/seed/catalogo.sql || (echo "db/seed/catalogo.sql está desactualizado: corre python3 db/tools/generar_seed.py" && exit 1)

      - name: Cliente de PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Pruebas de base de datos
        run: bash db/scripts/test.sh
