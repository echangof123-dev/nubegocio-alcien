name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cliente de PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: El seed coincide con el Excel
        run: |
          pip install openpyxl lxml cryptography
          python3 db/tools/generar_seed.py
          git diff --exit-code db/seed/catalogo.sql || (echo "db/seed/catalogo.sql está desactualizado: corre python3 db/tools/generar_seed.py" && exit 1)

      - name: Pruebas de base de datos
        run: bash db/scripts/test.sh

      - name: Dependencias
        run: npm install --no-audit --no-fund

      - name: Tipos de la API
        run: npm run typecheck -w @alcien/api

      - name: Tipos de la web
        id: tipos_web
        # Si falla no detiene la CI, pero deja cada error como aviso visible en GitHub
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck -w @alcien/web 2>&1 | sed -E 's/^(.*error TS[0-9]+.*)$/::warning title=Tipos de la web::\1/'

      - name: Aviso si fallaron los tipos de la web
        if: steps.tipos_web.outcome == 'failure'
        run: echo "::warning title=Tipos de la web::El chequeo de tipos de la web falló"

      - name: Pruebas de la API
        run: bash apps/api/scripts/test.sh

      - name: Compilar API y web
        run: npm run build

      - name: Recorrido completo en navegador
        run: |
          npx playwright install --with-deps chromium
          PGDATABASE=alcien_e2e bash db/scripts/reset.sh
          PGDATABASE=alcien_e2e ALCIEN_API_PASSWORD=alcien-e2e bash db/scripts/crear_usuario_api.sh
          (cd apps/api && echo '{"type":"module"}' > dist/package.json)
          node e2e/sri-falso.mjs &
          ALCIEN_ENTORNO=desarrollo PGUSER=alcien_api PGPASSWORD=alcien-e2e PGDATABASE=alcien_e2e \
            SRI_URL_PRUEBAS=http://127.0.0.1:9099/ws ALCIEN_WEB_DIR=apps/web/dist PORT=8080 node apps/api/dist/main.js &
          sleep 3
          BASE=http://localhost:8080 node e2e/flujo-venta.mjs

      - name: Imagen de Docker en modo producción
        run: |
          docker build -t alcien .
          docker run -d --name alcien --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=alcien_api -e PGPASSWORD=alcien-e2e -e PGDATABASE=alcien_e2e -e PORT=8090 \
            -e WHATSAPP_PROVEEDOR=registro -e ALCIEN_PERMITIR_CODIGOS_EN_REGISTRO=true \
            -e ALCIEN_SECRETO_CODIGOS="$(openssl rand -hex 32)" -e ALCIEN_CLAVE_FIRMAS="$(openssl rand -base64 32)" \
            alcien
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8090/api/salud && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/api/salud
          curl -fsS http://127.0.0.1:8090/ | grep -q "Al Cien"
          # En producción el código de acceso no se devuelve: solo queda en el registro
          curl -fsS -X POST -H 'content-type: application/json' -d '{"celular":"0991234599"}' http://127.0.0.1:8090/api/auth/codigo | grep -vq 'codigoDev'
          docker logs alcien 2>&1 | grep -q "código de acceso"
          docker rm -f alcien

      - name: Capturas del recorrido
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: e2e/capturas
