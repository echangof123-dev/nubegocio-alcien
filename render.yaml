# Blueprint de Render: la app y su base de datos PostgreSQL, las dos en el plan gratis.
# Guía: deploy/RENDER.md
databases:
  - name: alcien-db
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    databaseName: alcien
    user: alcien

services:
  - type: web
    name: alcien
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      # La app migra la base al arrancar con esta conexión (red interna de Render)
      - key: ALCIEN_DB_ADMIN_URL
        fromDatabase:
          name: alcien-db
          property: connectionString
      # Se generan solas y quedan guardadas en Render
      - key: ALCIEN_DB_API_PASSWORD
        generateValue: true
      - key: ALCIEN_SECRETO_CODIGOS
        generateValue: true
      - key: ALCIEN_CLAVE_FIRMAS
        generateValue: true
      - key: ALCIEN_TOKEN_TAREAS
        generateValue: true
      # Beta cerrada: el código de acceso queda en los registros (Logs) de Render
      - key: WHATSAPP_PROVEEDOR
        value: registro
      - key: ALCIEN_PERMITIR_CODIGOS_EN_REGISTRO
        value: "true"
      - key: SRI_INTERVALO_SEG
        value: "60"
